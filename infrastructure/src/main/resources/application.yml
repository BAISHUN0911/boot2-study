server:
  port: 8020

logging:
  level:
    root: info

#rocketmq:
#  name-server: 172.17.13.74:9876  # RocketMQ NameServer 地址

rocketmq:
  name-server: 172.17.13.74:9876

  #生产者配置
  producer:
    #生产者组名字
    group: "service-producer"
    # 消息最大长度 默认 1024 * 4 (4M)
    max-message-size: 4096
    # 发送消息超时时间，默认 3000
    send-message-timeout: 3000
    # 发送消息失败重试次数，默认2
    retry-times-when-send-failed: 2
    retry-times-when-send-async-failed: 2

spring:
  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://172.17.13.74:3306/mystudy?useUnicode=true
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location:  classpath:/mybatis/config/mybatis-config.xml